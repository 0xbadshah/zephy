version: 2

project_name: zephy

builds:
  - main: ./cmd/zephy
    binary: zephy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: internal/data/LICENSE
        dst: LICENSE-endoflife.date

checksum:
  name_template: checksums.txt

# release-please writes the changelog and creates the release as a
# draft; goreleaser uploads the archives into it and publishes it.
changelog:
  disable: true

release:
  use_existing_draft: true
  mode: keep-existing
